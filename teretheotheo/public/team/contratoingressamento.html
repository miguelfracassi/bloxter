<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Contrato de Ingressamento · Equipe Bloxter</title>
<link rel="icon" type="image/png" href="/icon.png?v=202610287732" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=202610287732" />
<meta name="theme-color" content="#000000" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/legal.css" />
<script>try{var th=localStorage.getItem('bx_theme');document.documentElement.setAttribute('data-theme',th==='light'?'light':'dark')}catch(e){}</script>
<style>
  .tc-main { width: min(100%, 760px); margin: 0 auto; padding: 22px 16px 60px; flex: 1; }
  .tc-paper { border: 1px solid var(--line); background: var(--card); border-radius: 18px; padding: 26px 22px; line-height: 1.7; font-size: 14.5px; }
  .tc-brand { font-weight: 700; letter-spacing: .18em; font-size: 12px; color: var(--fg2); }
  .tc-paper h1 { font-size: 24px; line-height: 1.25; margin: 6px 0 4px; }
  .tc-date { color: var(--fg2); font-size: 13px; margin: 0 0 18px; }
  .tc-paper h2 { font-size: 15.5px; margin: 22px 0 6px; }
  .tc-paper p, .tc-paper li { color: var(--fg); opacity: .92; margin: 6px 0; }
  .tc-paper ul { padding-left: 22px; margin: 6px 0; }
  .tc-fill { border-bottom: 1.5px solid var(--fg2); padding: 0 4px; font-weight: 600; white-space: pre-wrap; }
  .tc-fill.empty { color: var(--fg2); font-weight: 400; }
  .tc-form { display: grid; gap: 12px; margin-top: 26px; padding-top: 22px; border-top: 1px dashed var(--line); }
  .tc-form label.f { display: grid; gap: 5px; font-size: 13px; color: var(--fg2); font-weight: 500; }
  .tc-form input[type=text] { width: 100%; background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font: inherit; outline: none; }
  .tc-form input[type=text]:focus { border-color: var(--fg2); }
  .tc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .tc-grid { grid-template-columns: 1fr; } .tc-paper { padding: 20px 16px; } }
  .tc-padwrap { display: grid; gap: 6px; }
  .tc-padhead { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--fg2); font-weight: 500; }
  .tc-pad { position: relative; border: 1.5px dashed var(--fg2); border-radius: 12px; background: #fff; overflow: hidden; aspect-ratio: 3 / 1; }
  .tc-pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; display: block; }
  .tc-pad .hint { position: absolute; inset: 0; display: grid; place-items: center; color: #9a9a9a; font-size: 13px; pointer-events: none; }
  .tc-pad .line { position: absolute; left: 6%; right: 6%; bottom: 22%; border-bottom: 1px solid #cfcfcf; pointer-events: none; }
  .tc-chk { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; cursor: pointer; user-select: none; }
  .tc-chk input { width: 18px; height: 18px; margin-top: 3px; accent-color: #1d9bf0; flex: none; }
  .tc-err { color: #f4212e; font-size: 14px; min-height: 18px; }
  .tc-done { text-align: center; display: grid; gap: 12px; justify-items: center; }
  .tc-done img { width: 100%; max-width: 420px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .tc-ok { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: #00ba7c; color: #fff; font-size: 28px; font-weight: 700; }
</style>
</head>
<body class="legal-body">
<header class="legal-top"><a href="/" aria-label="Bloxter"><img class="symbol-img" src="/symbol.png" alt="Bloxter" /></a></header>
<main class="tc-main">
  <article class="tc-paper" id="paper"></article>
</main>
<footer class="legal-foot"><span>© 2026 Bloxter · From Ticord</span></footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/js/team-contrato.js"></script>
</body>
</html>
