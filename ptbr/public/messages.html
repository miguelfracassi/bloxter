<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mensagens · Bloxter</title>
  <meta name="description" content="Bloxter - a rede social feita para quem vive o roleplay." />
  <link rel="icon" href="/favicon.ico?v=20261029b" sizes="48x48" /><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20261029b" /><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261029b" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=202610287732" />
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script>
    // Aplica tema e idioma salvos antes de pintar a página (evita "flash").
    (function () {
      try {
        var th = localStorage.getItem('bx_theme');
        if (th !== 'light' && th !== 'dark') th = 'dark';
        document.documentElement.setAttribute('data-theme', th);
        var lg = localStorage.getItem('bx_lang');
        if (lg !== 'pt' && lg !== 'en') lg = (navigator.language || 'pt').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en';
        document.documentElement.lang = lg === 'pt' ? 'pt-BR' : 'en';
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Bloxter" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <script src="/js/pwa.js"></script>
</head>
<body data-page="messages">
  <div id="root"></div>
  <noscript><p style="padding:24px;font-family:sans-serif">Ative o JavaScript para usar o Bloxter.</p></noscript>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/common.js"></script>
  <script src="/js/messages.js"></script>
</body>
</html>
