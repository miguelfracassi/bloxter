<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#080808">
  <title>Criar notícia · Bloxter</title>
  <link rel="icon" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#080808;--panel:#111;--panel2:#171717;--line:#292929;--fg:#f5f5f5;--muted:#a5a5a5;--purple:#aa99ff;--red:#ff8585;font-family:Poppins,Arial,sans-serif;background:var(--bg);color:var(--fg)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% -20%,#2c2445 0,transparent 38%),var(--bg);font-family:Poppins,Arial,sans-serif;color:var(--fg)}button,input,textarea{font:inherit}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}
    .top{height:68px;padding:0 max(20px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12;background:#080808ca;backdrop-filter:blur(14px);position:sticky;top:0;z-index:3}.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:13px}.brand img{width:30px;height:30px;object-fit:contain}.top-actions{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px}.plain{color:var(--muted)}.plain:hover{color:var(--fg)}
    .wrap{max-width:1200px;margin:auto;padding:34px 22px 50px}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.3px;color:#c9bdff;text-transform:uppercase}.heading h1{font-size:clamp(26px,4vw,38px);letter-spacing:-1.2px;margin:6px 0}.heading p{font-size:12px;color:var(--muted);margin:0}.format{border:1px solid var(--line);border-radius:10px;background:#111;color:var(--muted);font-size:10px;padding:9px 12px;white-space:nowrap}
    .grid{display:grid;grid-template-columns:minmax(290px,.78fr) minmax(380px,1fr);gap:20px;align-items:start}.panel{background:linear-gradient(150deg,#141414,#0d0d0d);border:1px solid var(--line);border-radius:17px;padding:20px}.panel h2{font-size:14px;margin:0 0 15px}.field{display:grid;gap:7px;margin:0 0 15px}.field label{font-size:11px;font-weight:600}.field small{font-size:9px;color:#888;line-height:1.6}.field input,.field textarea{width:100%;border:1px solid #303030;background:#090909;color:var(--fg);border-radius:10px;padding:11px 12px;font-size:12px;outline:none}.field input:focus,.field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px #aa99ff20}.field textarea{min-height:126px;resize:vertical;line-height:1.6}.upload{min-height:120px;border:1px dashed #474747;border-radius:13px;background:#0a0a0a;display:grid;place-items:center;text-align:center;padding:15px;cursor:pointer;transition:.16s}.upload:hover,.upload.drag{border-color:#b7aaff;background:#15121e}.upload b{font-size:11px}.upload span{display:block;color:var(--muted);font-size:9px;margin-top:4px}.upload-icon{width:31px;height:31px;margin:0 auto 7px;color:#d6ccff}.upload-icon svg{width:100%;height:100%}.file-meta{font-size:9px;color:var(--muted);margin-top:7px;overflow-wrap:anywhere}
    .sliders{display:grid;grid-template-columns:1fr 1fr;gap:14px}.range-field{display:grid;gap:8px;margin-bottom:16px}.range-head{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}input[type=range]{width:100%;accent-color:#b9aaff}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{min-height:42px;padding:0 15px;border-radius:10px;border:1px solid transparent;background:#f2f2f2;color:#080808;font-size:10px;font-weight:700;cursor:pointer;transition:transform .16s,opacity .16s}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.btn.secondary{background:#181818;color:#eee;border-color:#343434}.btn.full{width:100%}.help{color:#777;font-size:9px;line-height:1.7;margin:11px 0 0}.preview-panel{padding:18px;position:sticky;top:86px}.preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.preview-head h2{margin:0;font-size:13px}.preview-head span{font-size:9px;color:#858585}.canvas-wrap{display:grid;place-items:center}.preview{width:min(100%,390px);height:auto;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:#171717;box-shadow:0 18px 48px #0008}.preview canvas{display:block;width:100%;height:100%;object-fit:contain}.preview-bottom{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:9px}.preview-bottom .btn{flex:none}.login-wrap{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:24px}.login-card{width:min(100%,420px);background:#111;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 22px 70px #0008}.login-card h1{font-size:21px;margin:7px 0}.login-card p{font-size:11px;color:var(--muted);line-height:1.7}.error{min-height:17px;color:var(--red)!important;font-size:10px!important}.footer{max-width:1200px;margin:auto;padding:17px 22px 27px;border-top:1px solid #ffffff12;display:flex;justify-content:space-between;color:#777;font-size:9px}.toast{position:fixed;z-index:8;bottom:20px;left:50%;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#f2f2f2;color:#080808;border-radius:10px;padding:10px 14px;font-size:10px;font-weight:600;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:800px){.top{height:60px;padding:0 14px}.wrap{padding:25px 13px 35px}.heading{align-items:flex-start;flex-direction:column;gap:10px;margin-bottom:17px}.heading h1{font-size:29px}.grid{grid-template-columns:1fr;gap:13px}.panel{padding:16px}.preview-panel{position:static;grid-row:1}.preview{width:min(100%,360px)}.footer{padding:15px 14px 25px}.actions .btn{flex:1}.preview-bottom{align-items:flex-start;flex-direction:column}.preview-bottom .btn{width:100%}}
  </style>
</head>
<body>
  <div id="app"><div style="padding:32px;color:#aaa">Carregando editor…</div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/js/notificias-criar.js"></script>
</body>
</html>
